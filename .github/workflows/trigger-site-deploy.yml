name: Trigger Private Site Deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/tools.json'
      - 'schema/tools.schema.json'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify dispatch token secret exists
        env:
          DISPATCH_TOKEN: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing secret: PRIVATE_REPO_DISPATCH_TOKEN in g4r-tech/awesome-cloud-guardrails"
            exit 1
          fi

      - name: Trigger deploy in private site repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_REPO_DISPATCH_TOKEN }}
          repository: g4r-tech/cloudguardrail
          event-type: public-tools-updated
          client-payload: '{"source":"awesome-cloud-guardrails"}'
